apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: happy-school

resources:
  # El orden importa: namespace primero, luego storage, luego servicios, luego apps
  - namespace.yaml
  - postgres-pvc.yaml
  - uploads-pvc.yaml
  - configmap.yaml
  - secret.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  # Descomenta la siguiente línea solo si tienes un Ingress Controller instalado:
  # - ingress.yaml
