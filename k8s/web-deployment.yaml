apiVersion: apps/v1
kind: Deployment
metadata:
  name: happy-school-web
  namespace: happy-school
  labels:
    app: happy-school-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: happy-school-web
  # RollingUpdate es seguro aquí (no usa PVCs ReadWriteOnce)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: happy-school-web
    spec:
      containers:
        - name: web
          image: happy-school-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
